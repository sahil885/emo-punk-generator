<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0208" />
    <meta name="robots" content="noindex" />
    <title>Offline — Text to Emo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0208;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background:
          radial-gradient(circle at 20% 10%, rgba(155, 48, 255, 0.18), transparent 55%),
          radial-gradient(circle at 85% 90%, rgba(255, 45, 120, 0.14), transparent 55%),
          #0a0208;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      .logo {
        display: block;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 24px;
        font-weight: 900;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.6);
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(90deg, #ff2d78, #9b30ff);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="96" height="96" aria-hidden="true" class="logo">
        <defs>
          <radialGradient id="bg" cx="50%" cy="42%" r="80%">
            <stop offset="0" stop-color="#22093d"/>
            <stop offset="0.6" stop-color="#12041f"/>
            <stop offset="1" stop-color="#0a0208"/>
          </radialGradient>
          <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff2d78"/>
            <stop offset="0.55" stop-color="#9b30ff"/>
            <stop offset="1" stop-color="#00cfff"/>
          </linearGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="1.4"/>
          </filter>
          <mask id="crack" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36">
            <rect x="-6" y="-6" width="36" height="36" fill="#fff"/>
            <polyline points="12,4.6 10.3,8.9 13.5,12.2 10.7,15.7 12.5,19.2 12,22.5" fill="none" stroke="#000" stroke-width="1.15" stroke-linejoin="miter" stroke-miterlimit="10"/>
          </mask>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <g transform="translate(256 262) scale(18) translate(-12 -12.2)">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heart)" filter="url(#glow)" opacity="0.6"/>
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#heart)" mask="url(#crack)"/>
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>Writing and playing songs needs a connection. Your songs are safe in My Songs — reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
